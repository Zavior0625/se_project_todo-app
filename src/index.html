<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
  </head>

  <body>
    <div class="page">
      <div class="page__content">
        <header class="header">
          <h1 class="header__title">The Simple ToDo App</h1>

          <p class="header__banner">Do these things</p>

          <button class="button button_action_add header__button" type="button">
            + Add Todo
          </button>
        </header>

        <main>
          <section class="counter">
            <h2 class="counter__text">Showing X out of Y completed</h2>
          </section>

          <section class="todos">
            <ul class="todos__list"></ul>

            <template id="todo-template">
              <li class="todo">
                <input class="todo__completed" type="checkbox" />

                <label class="todo__label">
                  <span class="todo__name"></span>
                  <span class="todo__date"></span>
                </label>

                <button class="todo__delete-btn" type="button"></button>
              </li>
            </template>
          </section>
        </main>
      </div>
    </div>

    <div class="popup" id="add-todo-popup">
      <div class="popup__content">
        <button
          aria-label="Close modal"
          class="popup__close"
          type="button"
        ></button>

        <h3 class="popup__title">Add new ToDo</h3>

        <form
          class="popup__form"
          id="add-todo-form"
          name="add-todo-form"
          novalidate
        >
          <fieldset class="popup__fieldset">
            <label class="popup__label" for="todo-name">
              What needs to be done?

              <input
                class="popup__input"
                id="todo-name"
                name="name"
                type="text"
                placeholder="Write here"
                minlength="2"
                maxlength="40"
                required
              />

              <span class="popup__error" id="todo-name-error"></span>
            </label>

            <label class="popup__label" for="todo-date">
              When does it need to be done? (optional)

              <input
                class="popup__input popup__input_type_date"
                id="todo-date"
                name="date"
                type="date"
              />

              <span class="popup__error" id="todo-date-error"></span>
            </label>
          </fieldset>

          <button class="button popup__button" type="submit">Create</button>
        </form>
      </div>
    </div>
  </body>
</html>
